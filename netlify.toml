[build]
  # Patch client/src/utils/api.js at build time to avoid calling users' localhost
  # (the client lives in a submodule and isn't pushed here). This replaces the
  # default localhost base URL with a relative `/api` before installing and
  # building.
  command = "cd client && if [ -f src/utils/api.js ]; then sed -i 's|http://localhost:5000/api|/api|g' src/utils/api.js; fi && npm install && npm run build"
  publish = "client/build"
  base = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "18"
